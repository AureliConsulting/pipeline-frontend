# Supabase CLI local development configuration.
project_id = "aureli-campaign-console"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Internal tool: no self-signup. Users are created by an operator
# (scripts/create-users.mjs or the Supabase dashboard).
enable_signup = false

# NOTE: [auth.email] enable_signup controls the email PROVIDER as a whole
# (sign-in included), not just self-service signup — leave it true. Public
# self-signup is blocked by [auth] enable_signup above; users are created
# out-of-band via scripts/create-users.mjs (Admin API), which bypasses that.
[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[analytics]
# Disabled: the Logflare analytics container requires the Docker daemon to be
# exposed on tcp://localhost:2375 on Windows, which is not a default/safe
# setup. Not needed for local development of this app.
enabled = false
