# Fixture campaign configuration (matches gtm_research
# campaign_runtime.CampaignConfig schema). Values containing spintax are
# quoted/block-scalar so YAML preserves them byte-for-byte.
campaign_id: "fixture_campaign_v1"
version: 1
name: "Fixture Campaign"
description: "Used by shared-package tests."

settings:
  preserve_spintax: true
  max_exa_queries: 4
  minimum_personalization_confidence: "moderate"
  max_leads_per_run: 500
  fail_on_undefined_variables: true
  generate_rendered_previews: true

generation:
  model: "deepseek-v4-flash"
  temperature: 0.2
  max_tokens: 1200
  max_attempts: 2
  evidence_confidence_threshold: 0.6
  max_evidence_age_days: 365
  prohibited_style_terms:
    - "leverage"
    - "seamless"

eligibility:
  allowed_outreach_decisions: ["Yes", "Review"]
  send_eligible_outreach_decisions: ["Yes"]
  require_email_approved: true
  require_email_eligible: true
  require_completed_research: true

emails:
  - id: "email_1"
    sequence_position: 1
    delay_days: 0
    subject: ""
    body: |
      Hey {{firstname}},

      {build|put together} the first campaign for {{companyname_casualized}} around {{gtm_trigger_short}}.

  - id: "email_2"
    sequence_position: 2
    delay_days: 3
    subject: ""
    body: |
      Hey {{firstname}},

      {Following up|Circling back} on {{secondary_signal_short}}.

variables:
  firstname:
    type: "source"
    source_column: "first_name"
    required: true

  companyname_casualized:
    type: "source"
    source_column: "companyname_casualized"
    fallback: "normalized_company_name"

  gtm_trigger_short:
    type: "generated"
    description: "A concise evidence-backed recent company event."
    max_words: 18
    evidence_required: true
    output_class: "verified_fact"

  secondary_signal_short:
    type: "generated"
    description: "A second relevant company signal, distinct from gtm_trigger_short."
    max_words: 18
    evidence_required: true
    output_class: "verified_fact"
    must_differ_from: ["gtm_trigger_short"]

  sender_company:
    type: "static"
    value: "Aureli"
    required: true
